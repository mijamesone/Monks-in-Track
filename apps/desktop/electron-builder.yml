# Windows installer for MonksTracker. Build with: pnpm --filter @monkstracker/desktop dist:win
appId: app.monkstracker.desktop
productName: MonksTracker
copyright: MonksTracker
directories:
  output: release
  buildResources: build
# No asar: the server runs as a separate process and reads its files straight from disk.
asar: false
files:
  - package.json
  - dist/**
  - server/**
  - web/**
  - build/icon.png
  - "!node_modules/**"
win:
  target: nsis
  icon: build/icon.png
  # Not code-signed: Windows shows "Windows protected your PC" once; choose More info, then Run anyway.
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MonksTracker
  artifactName: MonksTracker-Setup-${version}.${ext}
  # Your data in %LOCALAPPDATA%\MonksTracker is never touched by install, update or uninstall.
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: mijamesone
  repo: Monks-in-Track
  releaseType: release
