# Builds the Windows installer on a real Windows machine and publishes it as a GitHub release.
# Start it from the Actions tab: "Release Windows app" -> "Run workflow".
# Installed copies of MonksTracker find the new release by themselves and update.
#
# To publish an update: raise "version" in apps/desktop/package.json first (each release needs a new version).
name: Release Windows app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type checks
        run: pnpm typecheck

      - name: Tests (on Windows)
        run: pnpm test

      - name: Build the installer
        run: pnpm dist:win

      - name: Check the built app starts and serves MonksTracker
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'mt-smoke'
          $env:MONKSTRACKER_DATA = $data
          $app = Start-Process -FilePath 'apps\desktop\release\win-unpacked\MonksTracker.exe' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:4545/api/health'; $ok = $r.StatusCode -eq 200 } catch {}
          }
          if ($ok) {
            $page = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:4545/'
            if ($page.Content -notmatch 'MonksTracker') { $ok = $false; Write-Host 'The page did not look like MonksTracker.' }
          }
          Get-Process MonksTracker -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "$data\desktop.log") { Get-Content "$data\desktop.log" }
          if (-not $ok) { throw 'MonksTracker did not start on Windows.' }
          Write-Host 'MonksTracker started on Windows and answered.'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps\desktop\package.json -Raw | ConvertFrom-Json).version
          $dir = 'apps\desktop\release'
          $notes = @"
          Download **MonksTracker-Setup-$version.exe** below and double-click it. If Windows says "Windows protected your PC", click **More info**, then **Run anyway** (the app is not code-signed).

          It installs, opens in its own window, starts with Windows in the tray, and updates itself from this page. Your data stays on your PC in %LOCALAPPDATA%\MonksTracker. Full guide: docs/SETUP-WINDOWS.md.
          "@
          gh release create "v$version" "$dir\MonksTracker-Setup-$version.exe" "$dir\MonksTracker-Setup-$version.exe.blockmap" "$dir\latest.yml" --target $env:GITHUB_SHA --title "MonksTracker $version" --notes $notes
